# Local-development Nginx edge for ConfessIt.
#
# This is the only published application entry point in docker-compose.dev.yml.
# It has two loopback ports, both owned by this one container:
#
#   * :8080 (host 127.0.0.1:5173) -- the SPA, proxied to the Vite dev server.
#   * :8101 (host 127.0.0.1:8001) -- the API and WebSockets, proxied to backend.
#
# Keeping the API on its own port preserves the existing API URL, the backend's
# `/auth` refresh-cookie path and its test suite. A single-origin /api layout
# would collide with SPA routes (/admin, /profile, /games, ...) or require
# rewriting the cookie path. Grafana is the only other host-published service.
#
# Rate limiting is deliberately at the edge, not only in the application: each
# client address has one shared budget for page/dev-server traffic and a tighter
# one for the API. The backend's own global and per-endpoint limiters still run
# behind this; a request must pass both. A 429 is answered here so abusive
# volume never reaches the app.

# Preserve the WebSocket handshake for both the Vite HMR socket and the
# application sockets (`/messages/ws/...`, `/games/case-closed/ws`).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Query strings are deliberately stripped from the access log: WebSocket
# tickets and magic-link tokens travel there. The backend has the same rule.
log_format confessit_dev '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'rt=$request_time uct="$upstream_connect_time" '
                         'urt="$upstream_response_time"';

# One budget for the page/dev-server assets, one for API calls. The burst
# values absorb a cold page load (many module requests) and normal chatty UI
# polling without turning a real flood into nothing.
limit_req_zone $binary_remote_addr zone=web:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------------
# SPA / Vite dev server
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    # Every proxied request on this listener is rate limited. (/healthz is a
    # local return handled in the rewrite phase, so it is deliberately outside
    # the budget -- it never touches the application.)
    limit_req zone=web burst=200 nodelay;

    access_log /var/log/nginx/access.log confessit_dev;
    server_tokens off;

    # The backend also sets these; repeating them here covers static assets and
    # proxy errors that never reach the application.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Container-local liveness probe; not proxied to the dev server.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxying the Vite dev server keeps HMR working in development;
    # production serves built files directly from this same Nginx image (see
    # frontend/Dockerfile / nginx/nginx.prod.conf.template).
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: nginx is the public edge, so a
        # client-supplied X-Forwarded-For must not become the address anything
        # downstream reads.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------------------------------------------------------------------------
# API / WebSockets
# ---------------------------------------------------------------------------
server {
    listen 8101;
    server_name _;

    # The larger legitimate body is a base64 love-note image or the bulk
    # upload (10 MiB); the backend's RequestBodyLimitMiddleware is the precise
    # ceiling. Nginx's 1 MiB default would reject valid uploads before they got
    # there.
    client_max_body_size 20m;

    # Every API endpoint is rate limited here. The backend's global and
    # per-endpoint limits remain the authoritative application-level checks.
    limit_req zone=api burst=60 nodelay;

    access_log /var/log/nginx/access.log confessit_dev;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # No path rewrite: the backend serves /auth, /confessions, /api/time, etc.
    # exactly as the browser requests them.
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # As above: do not trust a client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived chat sockets plus the slower admin/AI operations.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
