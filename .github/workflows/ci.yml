name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run linting
        run: npm run lint
      - name: Run tests
        run: npm run test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      # One credential block, so the service, the CREATE DATABASE step and the suite
      # cannot drift apart the way a duplicated literal in three places would.
      # Named DB_PASSWORD to match the root .env the stack reads locally; the stock
      # postgres image still wants its own POSTGRES_PASSWORD variable below, so the
      # same value is mapped onto that name for the service container.
      POSTGRES_USER: confessit
      DB_PASSWORD: ConfessItLocalPassword
      DATABASE_URL: "postgresql+psycopg://confessit:ConfessItLocalPassword@localhost:5432/ConfessIt"
      TEST_DATABASE_URL: "postgresql+psycopg://confessit:ConfessItLocalPassword@localhost:5432/ConfessIt_Test"
      # Required and validated by app.config: the suite mints and verifies real JWTs
      # against it, so CI pins the same fixed test-only key tests/conftest.py falls
      # back to. Never a production key.
      SECRET_KEY: "e359d5a93f086c7c3a90b56c390fd03a1e700708cc21c5a5ebaf7ab01436c491"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: confessit
          POSTGRES_PASSWORD: ConfessItLocalPassword
          POSTGRES_DB: ConfessIt
        ports:
          - 5432:5432
        # The suite truncates TEST_DATABASE_URL before every test, so the server has to be
        # accepting connections before pytest starts; otherwise the first session fails on
        # a connection refused and the whole run is a false negative.
        options: >-
          --health-cmd "pg_isready -U confessit -d ConfessIt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile, so the suite runs on the interpreter the app ships.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create the test database
        # tests/conftest.py refuses to start unless TEST_DATABASE_URL names a database
        # other than DATABASE_URL, because its clear_db fixture truncates every table.
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h localhost -U "$POSTGRES_USER" -d ConfessIt \
            -c 'CREATE DATABASE "ConfessIt_Test";'
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    # A fresh checkout has no .env, and .env is gitignored so it cannot be committed. The
    # compose file interpolates these at start-up and fails fast when they are missing, so
    # the build needs them from here. Dev-only values, matching the local .env.
    env:
      DB_PASSWORD: ConfessItLocalPassword
      REDIS_PASSWORD: ConfessItLocalRedisPassword
      GRAFANA_ADMIN_PASSWORD: ConfessItLocalGrafanaPassword
      # Parsed, not run, by `docker compose build`: the `:?` interpolation fails closed
      # when a variable is missing, so the build carries the same names a real start
      # needs. The value is irrelevant at build time -- nothing bakes it into the image.
      SECRET_KEY: compose-build-placeholder-not-a-real-key-00000000
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose Build
        run: docker compose build
