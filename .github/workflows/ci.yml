name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Least privilege (INFRA-002): every job inherits read-only repository access.
# Jobs that upload artifacts add `actions: write` on themselves. Nothing here
# creates releases, pushes commits, or comments on PRs, so no broader scope is
# granted. Third-party actions below are pinned to full commit SHAs (version in
# the trailing comment), never to moving tags: a tag can be repointed, a SHA
# cannot. Dependabot's github-actions ecosystem (see dependabot.yml) proposes
# the updates, so frozen does not mean forgotten.
permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    # actions:write for the SBOM upload below; everything else needs contents:read.
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Vite 7 requires ^20.19.0 || >=22.12.0; pin the newer line.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        # Strict ci (never `|| npm install`): a lockfile drift must fail loudly rather
        # than silently resolving fresh versions in CI that nobody reviewed.
        run: npm ci
      - name: Run linting
        run: npm run lint
      - name: Zero-warning ratchet (advisory)
        # `--max-warnings 0` is enforced here as a non-blocking ratchet while the
        # historical warning backlog (no-explicit-any etc.) is worked down; the
        # blocking `npm run lint` above already fails on errors.
        continue-on-error: true
        run: npm run lint -- --max-warnings 0
      - name: Run tests
        run: npm run test
      - name: Audit shipped dependencies
        # Production attack surface only (--omit=dev): build/lint tooling carries
        # transitive highs with no patched versions, which Dependabot keeps pressure
        # on instead. Anything high or critical in what ships to browsers fails here;
        # a high with no patched version gets a documented exception, not a silent pass.
        run: npm audit --omit=dev --audit-level=high
      - name: Unused dependency check (advisory)
        # depcheck flags unused/shadowed deps (e.g. dev-only tagger helpers, removed
        # cmdk/embla/vaul/input-otp/resizable-panels). Advisory: it false-positives on
        # dynamically-imported modules, so failures are triage, not gates.
        continue-on-error: true
        run: npx --yes depcheck --ignores="eslint-*,@types/*,tailwindcss,autoprefixer,postcss,jsdom,@testing-library/*,typescript,vitest,@vitejs/*,@tailwindcss/*"
      - name: Generate frontend SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx -o sbom-frontend.cdx.json
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-frontend
          path: ./frontend/sbom-frontend.cdx.json
      - name: Trivy filesystem scan (advisory)
        # Advisory (exit-code 0 + SARIF) while pre-existing HIGHs in dev tooling are
        # triaged; npm audit above remains the blocking prod-dependency gate.
        # Note the repo tags this release `v0.28.0`: the bare `0.28.0` ref is pinned
        # here by SHA like everything else, so resolution never depends on tag aliasing.
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  backend-tests:
    runs-on: ubuntu-latest
    # actions:write for the SBOM upload below; everything else needs contents:read.
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        working-directory: ./backend
    env:
      # One credential block, so the service, the CREATE DATABASE step and the suite
      # cannot drift apart the way a duplicated literal in three places would.
      # Named DB_PASSWORD to match the root .env the stack reads locally; the stock
      # postgres image still wants its own POSTGRES_PASSWORD variable below, so the
      # same value is mapped onto that name for the service container.
      POSTGRES_USER: confessit
      DB_PASSWORD: ConfessItLocalPassword
      DATABASE_URL: "postgresql+psycopg://confessit:ConfessItLocalPassword@localhost:5432/ConfessIt"
      TEST_DATABASE_URL: "postgresql+psycopg://confessit:ConfessItLocalPassword@localhost:5432/ConfessIt_Test"
      # Required and validated by app.config: the suite mints and verifies real JWTs
      # against it, so CI pins the same fixed test-only key tests/conftest.py falls
      # back to. Never a production key.
      SECRET_KEY: "e359d5a93f086c7c3a90b56c390fd03a1e700708cc21c5a5ebaf7ab01436c491"
      # Test-only token pepper, matching tests/conftest.py. Never a production value.
      TOKEN_HASH_PEPPER: "bb5e97d44532f0cf881d23496899e04175c30d8db62b501c5a22057ab1200e31"
      # Required by app.config with no default. Nothing here speaks Redis (pub/sub is
      # stubbed and the flood brake is disabled in tests), so this only has to exist
      # for settings to build -- it must never point at a real store the suite could
      # dirty.
      REDIS_URL: "redis://localhost:6379"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: confessit
          POSTGRES_PASSWORD: ConfessItLocalPassword
          POSTGRES_DB: ConfessIt
        ports:
          - 5432:5432
        # The suite truncates TEST_DATABASE_URL before every test, so the server has to be
        # accepting connections before pytest starts; otherwise the first session fails on
        # a connection refused and the whole run is a false negative.
        options: >-
          --health-cmd "pg_isready -U confessit -d ConfessIt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Matches backend/Dockerfile, so the suite runs on the interpreter the app ships.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit Python dependencies
        # Fail-closed on known vulnerabilities in the pinned tree, with no
        # exceptions: the PYSEC-2026-3447 (CVE-2026-59890, setuptools sdist
        # handling) waiver used to live here, but it is moot -- the pinned
        # setuptools==84.0.0 is past the 83.0.0 fix, and nothing in the tree
        # imports pkg_resources (see requirements.txt), so there is nothing to
        # waive. A future advisory with no patched version gets a documented
        # ignore with an expiry date, never a silent one.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Create the test database
        # tests/conftest.py refuses to start unless TEST_DATABASE_URL names a database
        # other than DATABASE_URL, because its clear_db fixture truncates every table.
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h localhost -U "$POSTGRES_USER" -d ConfessIt \
            -c 'CREATE DATABASE "ConfessIt_Test";'
      - name: Run tests
        env:
          PYTHONPATH: .
        # --strict-markers: only builtin markers (parametrize) are used, so an
        # unregistered marker is always a typo worth failing on. Coverage is
        # reported (term-missing) as a non-gating baseline; a --cov-fail-under
        # gate follows once the baseline is pinned.
        run: |
          pip install pytest-cov
          pytest --strict-markers --cov=app --cov-report=term-missing
      - name: Generate backend SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -o sbom-backend.cdx.json
      - name: Upload backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-backend
          path: ./backend/sbom-backend.cdx.json
      - name: Trivy filesystem scan (advisory)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  docker-build:
    runs-on: ubuntu-latest
    # A fresh checkout has no .env, and .env is gitignored so it cannot be committed. The
    # compose files interpolate these at start-up and fail fast when they are missing, so
    # the builds need them from here. Production-only names get CI placeholders; they are
    # parsed, never baked in -- VITE_API_URL only has to be https:// to pass the
    # build-time check.
    env:
      DB_PASSWORD: ConfessItLocalPassword
      REDIS_PASSWORD: ConfessItLocalRedisPassword
      GRAFANA_ADMIN_PASSWORD: ConfessItLocalGrafanaPassword
      SERVER_NAME: ci.example.com
      API_ORIGIN: api.ci.example.com
      VITE_API_URL: https://ci.example.com
      PUBLIC_BASE_URL: https://ci.example.com
      CORS_ORIGINS: https://ci.example.com
      ALLOWED_HOSTS: ci.example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create placeholder env files
        # backend/.env and backend/.scheduler.env are gitignored, but `docker compose
        # config` refuses to resolve a service whose env_file is absent. Copies of the
        # tracked templates are enough to parse and build; nothing here starts a service.
        run: |
          cp backend/.env.example backend/.env
          cp backend/.scheduler.env.example backend/.scheduler.env
      - name: Verify production compose build
        run: docker compose build
      - name: Verify dev compose build
        run: docker compose -f docker-compose.dev.yml build
      - name: Verify compose files parse
        # No build: validates names, structure and required variables against the
        # stand-ins above. A missing `:?` variable or bad YAML fails here, not at 3am.
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
