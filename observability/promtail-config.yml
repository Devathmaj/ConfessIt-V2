server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # tenant_id sends X-Scope-OrgID, which loki-config.yml's auth_enabled now requires.
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: confessit

scrape_configs:
  - job_name: "docker"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "docker"
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: "backend-file"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "backend-file"
          __path__: /var/log/confessit/*.log*
