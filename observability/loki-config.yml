# Multi-tenancy on: every read and write must carry an X-Scope-OrgID header, which
# the OTel Collector's OTLP/HTTP exporter sends. This is tenant isolation, not
# authentication -- it stops anonymous queries and keeps tenants apart, but anyone who can
# reach the port can still claim a tenant. The real control is that the port is not
# published off the host (see docker-compose.yml).
auth_enabled: true

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
    # Loki's native OTLP ingestion requires structured metadata, supported by the
    # TSDB index. This preserves existing BoltDB-shipped data and applies TSDB
    # only to logs written on or after this date.
    - from: 2026-10-23
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_tsdb_
        period: 24h

# The log store accumulates request paths and user identifiers, so retention is
# bounded rather than open-ended.
limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# No ruler block: the only consumer a ruler would notify is an Alertmanager, and
# this stack deliberately runs none (Prometheus evaluates the alert rules in
# alerting-rules.yml and exposes their state through its own API and Alerts
# page). A ruler stanza pointed at the default Alertmanager port nothing listens
# on would only fail closed on rule evaluation while alerting nobody -- removed
# rather than left as dead configuration implying coverage.
