# Datasources provisioned into Grafana at start-up, so a fresh `docker compose up`
# yields a Grafana that is already connected to the telemetry stack instead of one
# that has to be pointed at Prometheus, Loki and Tempo by hand.
#
# The URLs are Compose service names, not localhost. Grafana is a container on the
# same network, so `prometheus:9090` etc. is the address that actually resolves
# there; `localhost` inside the Grafana container is Grafana itself. These are the
# same hostnames otel-collector-config.yml and prometheus.yml already use.
#
# No credential appears in this file. Prometheus, Loki and Tempo are all reached
# without authentication over the Compose network, except Prometheus itself:
# its remote-write receiver (and therefore its whole HTTP surface, basic auth
# cannot be scoped to one path) requires the user below. Loki's `auth_enabled`
# is tenant isolation, not login, and the tenant is a name rather than a
# secret -- it is already written literally in otel-collector-config.yml and
# promtail-config.yml. The Prometheus password is never written here either: it
# arrives through the `$__file{}` pointer below, which Grafana resolves from the
# mounted gitignored observability/.rw-password at start-up. Single `$`, not `$$`:
# Grafana's provisioning expander treats an unescaped `$__file{path}` as a file
# macro and reads the file; a doubled `$$` escapes to a literal `$`, which would
# store the text `$__file{...}` itself as the password and every query would keep
# failing authentication (Prometheus answers 401, Grafana surfaces 400) no matter
# how often the container restarts. (The doubled `$$` in `$${__value.raw}` below
# is the opposite case on purpose: that placeholder must survive provisioning as
# a literal for the frontend's template engine to fill in at query time.)
# Grafana's own admin login stays in the root .env
# via GF_SECURITY_ADMIN_*.
apiVersion: 1

# Applied on every start, so an edit here replaces the previous definition instead
# of colliding with it or leaving a stale copy behind in grafana_data.
overwrite: true

datasources:
  - name: Prometheus
    uid: confessit-prometheus
    type: prometheus
    # prometheus.yml scrapes otel-collector:8889, so the backend's own OTLP metrics
    # arrive here after passing through the collector's metrics pipeline.
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    # Prometheus requires basic auth since its remote-write receiver was
    # authenticated (see prometheus.yml): queries fail without this, including
    # Grafana's start-up health check of the datasource.
    basicAuth: true
    basicAuthUser: tempo
    jsonData:
      httpMethod: POST
      # Matches the scrape interval in prometheus.yml, so a panel covers at least one
      # full scrape and a newly started backend shows a point without a long wait.
      timeInterval: 15s
    # The password is read from the mounted file, not tracked here.
    secureJsonData:
      basicAuthPassword: $__file{/etc/grafana/rw-password}
    editable: false

  - name: Loki
    uid: confessit-loki
    type: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      # loki-config.yml sets auth_enabled: true, so every read must carry the tenant
      # header or the query is rejected. Sent the same way promtail and the
      # collector's OTLP/HTTP exporter send it, which is what keeps Grafana pointed at the
      # same tenant those two write to -- querying without it returns nothing even
      # while logs are visibly arriving.
      httpHeaderName1: X-Scope-OrgID
      maxLines: 1000
      # Logs -> traces. Loki's native OTLP ingestion stores trace IDs as structured
      # metadata (trace_id), not as an indexed label or part of the log body. This
      # derived field links that metadata value to the matching trace. The
      # reverse direction, trace to logs, is tracesToLogsV2 on the Tempo datasource
      # below.
      #
      # Grafana matches the structured metadata key without promoting it to an
      # indexed stream label, avoiding one Loki stream per request.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: '^trace_id$'
          # Grafana parses the trace id itself and opens the Tempo datasource with it.
          # The doubled $$ escapes the provisioning loader's environment variable
          # expansion, so the placeholder survives into the datasource as a literal.
          url: '$${__value.raw}'
          datasourceUid: confessit-tempo
    secureJsonData:
      httpHeaderValue1: confessit
    editable: false

  - name: Tempo
    uid: confessit-tempo
    type: tempo
    # tempo.yml listens on 3200 and that port serves the query API (/ready,
    # /api/search, /api/traces/<id>), which is the API Grafana's Tempo datasource
    # calls. 4317 on the same container is OTLP ingestion, not queryable.
    url: http://tempo:3200
    access: proxy
    jsonData:
      # No search path override: /api/search is Tempo's default and is what
      # Grafana uses to turn a trace ID into a trace.
      tracesToLogsV2:
        datasourceUid: confessit-loki
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
        filterByTraceID: true
        filterBySpanID: false
    editable: false
