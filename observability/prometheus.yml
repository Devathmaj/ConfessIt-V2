global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting runs in Prometheus's own rule engine, which is already part of this stack.
# No Alertmanager is configured: the rules evaluate and their state is readable from
# the /api/v1/rules endpoint and the Alerts page, without adding a notification
# destination that does not exist.
rule_files:
  - /etc/prometheus/alerting-rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector serves two different things on two ports, and only one of them
  # was scraped. :8889 is the app-facing Prometheus exporter, which carries the
  # metrics the backend pushes over OTLP. :8888 is the collector's own
  # telemetry: receiver counters (otelcol_receiver_accepted_spans and friends)
  # and per-exporter send-failure counters. Without this job that health signal
  # is invisible, so a pipeline that has stopped moving data looks identical to
  # one that is merely quiet.
  #
  # Named distinctly from the "otel-collector" job above so that the existing
  # job name keeps meaning exactly one thing -- the :8889 app-metrics path --
  # which is what the availability rule in alerting-rules.yml matches on with
  # up{job="otel-collector"}. A second target under the same job name would
  # merge into it and make that rule ambiguous.
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]
