global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The remote-write receiver (enabled in docker-compose.yml for Tempo's metrics
# generator) takes unauthenticated writes by default, which would let any
# container on the Compose network forge the RED/service-graph series the
# alerts read. HTTP basic auth closes it: it lives in the separate web config
# file (prometheus-web.yml -- this main config has no such field) and applies
# to everything Prometheus serves, receiver included. The only writer is Tempo,
# which authenticates with the password in the gitignored
# observability/.rw-password (mounted into its container; see tempo.yml). This
# also gates the UI, the query API and /-/ready, so Grafana's datasource and
# the healthcheck authenticate the same way -- Grafana with a file pointer (no
# secret lands in its tracked provisioning), the healthcheck by reading the
# mounted file.
# The hash in prometheus-web.yml is bcrypt of that password: safe to track,
# recompute both together on rotation.

# Alerting runs in Prometheus's own rule engine, which is already part of this stack.
# No Alertmanager is configured: the rules evaluate and their state is readable from
# the /api/v1/rules endpoint and the Alerts page, without adding a notification
# destination that does not exist.
rule_files:
  - /etc/prometheus/alerting-rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector serves two different things on two ports, and only one of them
  # was scraped. :8889 is the app-facing Prometheus exporter, which carries the
  # metrics the backend pushes over OTLP. :8888 is the collector's own
  # telemetry: receiver counters (otelcol_receiver_accepted_spans and friends)
  # and per-exporter send-failure counters. Without this job that health signal
  # is invisible, so a pipeline that has stopped moving data looks identical to
  # one that is merely quiet.
  #
  # Named distinctly from the "otel-collector" job above so that the existing
  # job name keeps meaning exactly one thing -- the :8889 app-metrics path --
  # which is what the availability rule in alerting-rules.yml matches on with
  # up{job="otel-collector"}. A second target under the same job name would
  # merge into it and make that rule ambiguous.
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]

  # The backend itself, for liveness only.
  #
  # Every other series here reaches Prometheus indirectly: the application pushes OTLP
  # to the collector, and the collector is scraped on :8889. A pushed pipeline has no
  # series that says whether its producer is alive, so a backend that had died was
  # indistinguishable from a backend that was merely idle -- the collector target would
  # stay up, and the collector's own receiver counters would simply stop advancing.
  # Scraping the backend gives up{job="confessit-backend"} something real to measure,
  # which is what the ConfessItBackendDown rule watches.
  #
  # The endpoint deliberately serves only process liveness and start time. It does not
  # re-export the OTel instruments, because a second copy of every http_server_* series
  # under a different job label would double-count every RED query that does not pin
  # exported_job. The application metrics stay on the OTLP path, where they already
  # arrive via the "otel-collector" job above.
  #
  # The scrape reuses the port the server already binds, so no new listener is involved.
  # Prometheus reaches it over the Compose network; note that 8001 is separately
  # published to the host, which is finding M7's problem and not fixed here.
  - job_name: "confessit-backend"
    static_configs:
      - targets: ["backend:8001"]
