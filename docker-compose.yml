services:

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    ports:
      - "5173:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  backend:
    build:
      context: ./backend
    command: [
      "uvicorn",
      "app.main:app",
      "--host",
      "0.0.0.0",
      "--port",
      "8001",
      "--reload",
      "--reload-dir",
      "app",
      # Bound how many request bodies can be in flight at once, and how many bytes are
      # buffered for an unfinished request. Per-body size is capped in app.main.
      "--limit-concurrency",
      "${MAX_CONCURRENCY:-100}",
      "--h11-max-incomplete-event-size",
      "16384"
    ]
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./archives:/app/archives
    depends_on:
      - redis
      - postgres
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY: "0.5"
      # Read by both the --limit-concurrency flag above and the app's own settings, so
      # the ceiling cannot differ between how the server is started and how it is
      # configured. Raising it widens what one process will hold at once, so the request
      # body cap is what should move first if this needs raising.
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-100}
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql+psycopg://confessit:${POSTGRES_PASSWORD:-ConfessItLocalPassword}@postgres:5432/ConfessIt"

      TEST_DATABASE_URL: "postgresql+psycopg://confessit:${POSTGRES_PASSWORD:-ConfessItLocalPassword}@postgres:5432/ConfessIt_Test"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "confessit-backend"
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: confessit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ConfessItLocalPassword}
      POSTGRES_DB: ConfessIt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
  redis:
    image: redis:7-alpine
    container_name: confessit_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3050:3050"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./backend:/var/log/confessit:ro
      - promtail_positions:/tmp
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
      - "4319:4317"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo

volumes:
  postgres_data:
    name: confessit_postgres_data
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  tempo_data:
