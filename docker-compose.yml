services:

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    ports:
      - "5173:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  backend:
    build:
      context: ./backend
    command: [
      "uvicorn",
      "app.main:app",
      "--host",
      "0.0.0.0",
      "--port",
      "8001",
      "--reload",
      "--reload-dir",
      "app",
      # Bound how many request bodies can be in flight at once, and how many bytes are
      # buffered for an unfinished request. Per-body size is capped in app.main.
      "--limit-concurrency",
      "${MAX_CONCURRENCY:-100}",
      "--h11-max-incomplete-event-size",
      "16384"
    ]
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./archives:/app/archives
    depends_on:
      - redis
      - postgres
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY: "0.5"
      # Read by both the --limit-concurrency flag above and the app's own settings, so
      # the ceiling cannot differ between how the server is started and how it is
      # configured. Raising it widens what one process will hold at once, so the request
      # body cap is what should move first if this needs raising.
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-100}
      # Origin the *browser* uses to fetch uploaded images. Image delivery URLs are
      # minted by the backend and point back at the proxy routes under /api/*/files, so
      # this has to be the published API origin, not the frontend's. Left unset it falls
      # back to PUBLIC_BASE_URL, which in backend/.env names the Vite dev server's
      # container-internal port (8080) -- an origin nothing is published on, so every
      # avatar URL 404s at the connection stage while the upload itself still succeeds.
      # Override when the API is published on another host or port.
      ASSET_BASE_URL: "${ASSET_BASE_URL:-http://localhost:8001}"
      # Injected so backend/.env can resolve REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379"
      # via python-dotenv, which keeps the root .env the only file the credential is written
      # in. REDIS_URL itself stays out of this file; setting it in the environment overrides.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env}
      DATABASE_URL: "postgresql+psycopg://confessit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}@postgres:5432/ConfessIt"

      TEST_DATABASE_URL: "postgresql+psycopg://confessit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}@postgres:5432/ConfessIt_Test"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "confessit-backend"
      # Report only the current (1.21+) HTTP semantic conventions. Unset, or set to
      # "http/dup", the instrumentation also emits the pre-1.20 names; "http" is the
      # mode that retires them outright.
      #
      # This is a clean break, not a compatibility layer: nothing in this stack needs
      # to read old telemetry, and carrying both generations only doubled the
      # attribute count on every span and data point. The consequences were migrated
      # with it rather than worked around:
      #   * http.server.duration (ms) is gone, replaced by
      #     http.server.request.duration (s), so the PromQL in
      #     observability/alerting-rules.yml and README.md was rewritten and the
      #     latency threshold moved from 1000ms to 1s to match the new unit and
      #     bucket boundaries.
      #   * http_status_code -> http_response_status_code, http_method ->
      #     http_request_method, http_target -> http.route.
      #   * BOUNDED_HTTP_METRIC_ATTRIBUTES in main.py now allowlists only the
      #     current names, so it no longer needs the pre-1.20 ones to keep the
      #     method/status dimensions alive.
      # Query-string redaction in app.telemetry deliberately still covers the
      # pre-1.20 URL attributes; see the note on _URL_ATTRIBUTES for why that is
      # defence in depth against a span from another source rather than
      # compatibility handling for our own emission.
      #
      # Only the HTTP signal is opted in. database and gen_ai exist too and are
      # deliberately left off: SQLAlchemy and Redis spans keep the pre-1.20 db.*
      # names, which is a separate migration and would change the H4 spanmetrics
      # labels at the same time as this one.
      OTEL_SEMCONV_STABILITY_OPT_IN: "http"
  postgres:
    image: postgres:16-alpine
    # Published to the host on loopback only, so a host-side psql/DBeaver can attach
    # while nothing on the network can reach the database or the application data in
    # it. This is the same posture as the observability UIs below, which bind
    # 127.0.0.1 too. The earlier "5432:5432" mapping bound every host interface and
    # was the LAN exposure.
    #
    # The host port is 5433, not 5432, because an installed PostgreSQL 18 Windows
    # service (postgresql-x64-18) already holds the host's 5432 on 0.0.0.0:5432, and
    # two listeners cannot share a port. 5433 is free. The container port is still 5432
    # and every other service reaches it as postgres:5432 over the Compose network.
    # If that service is ever removed, change the host side back to 5432 to match the
    # port clients already expect.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: confessit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ConfessIt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
  redis:
    image: redis:7-alpine
    container_name: confessit_redis
    restart: unless-stopped
    # Chat traffic rides on conversation:<id> pub/sub channels, so an open Redis lets
    # anyone on the network read every live message and publish forged ones. The port is
    # internal only (expose, not ports) and the server refuses commands without a password.
    # The password arrives as an env var and the shell below expands it, keeping the secret
    # out of the process arguments where `ps` inside the container would expose it. Compose
    # resolves ${REDIS_PASSWORD} from the shell environment or the gitignored root .env, so
    # the value is injected at start-up and no credential is stored in this tracked file.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env}
    # maxmemory is kept as a hard ceiling but the eviction policy is not set. The
    # application only ever issues PING, PUBLISH and SUBSCRIBE, and never writes a
    # key, so there is nothing for any policy to evict and allkeys-lru could never
    # engage; it only implied Redis was a cache. With the policy left at the
    # noeviction default, a future feature that does start writing keys fails loudly
    # at the ceiling instead of silently discarding entries.
    command: >
      sh -c 'exec redis-server
      --maxmemory 128mb
      --save 900 1
      --save 300 10
      --requirepass "$$REDIS_PASSWORD"'
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  otel-collector:
    # The Docker Hub org is otel/, not opentelemetry/; the latter is not a pullable
    # repository, so this service could not start at all.
    image: otel/opentelemetry-collector-contrib:0.99.0
    command: ["--config=/etc/otel-collector-config.yml"]
    # Ingestion and scrape ports are reachable only on the Compose network: the backend
    # pushes to otel-collector:4317 and Prometheus scrapes otel-collector:8889, neither of
    # which needs a host socket. Nothing here should be exposed beyond the host.
    expose:
      - "4317"
      - "4318"
      - "8889"
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    # Ordered on readiness, not merely on start. Both exporters in the config point
    # at these two services, and a bare depends_on only waits for the container to
    # be created, so a slow Loki comes up first and the collector spends the first
    # seconds failing to export until BatchSpanProcessor's retry papers over it.
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Tempo 2.5's metrics-generator delivers the RED and service-graph series it
      # derives from traces by remote write; it has no local scrape endpoint. This
      # flag is the receiver for that. The endpoint stays bound to loopback.
      - "--web.enable-remote-write-receiver"
    # Loopback only: the metrics contain request rates, error counts and target topology.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    # Grafana health-checks every datasource on start-up, so it needs a readiness
    # signal of its own to wait on. /-/ready is the endpoint Prometheus exposes for
    # exactly this; the image ships busybox wget and no curl.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:10.4.3
    # Loopback only: Grafana is the read surface for every log, metric and trace in the
    # stack, so it must not be reachable from the LAN.
    ports:
      - "127.0.0.1:3050:3050"
    environment:
      # The image listens on 3000, but the port mapping above targets 3050, so without
      # this the host port forwards to a port nothing is listening on.
      GF_SERVER_HTTP_PORT: "3050"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Required, from the gitignored root .env. Note Grafana applies this only when it
      # initialises an empty database, so an existing grafana_data volume keeps the old
      # password until it is reset.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the root .env}
      # Anonymous read access is off by default; pinned so a future image default cannot
      # quietly open the dashboards. Setting the org role as well was inert: Grafana
      # never consults it while anonymous access is disabled, and its startup log
      # reported only the line above as applied.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioned from the repository at every start, so the datasources are
      # recreated rather than configured once by hand. Read-only: Grafana must not be
      # able to rewrite the definitions that make the stack reproducible.
      #
      # Only the datasources subdirectory is overlaid, not the whole provisioning
      # path. Grafana also reads plugins/, notifiers/, alerting/ and dashboards/ from
      # there, and replacing the directory root hides the copies in the image, so it
      # logs a read error for each of the four. Overlaying the one directory that is
      # actually provisioned leaves the rest intact.
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # The operator dashboard, overlaid the same way. Without this a fresh
      # `docker compose up` yields a connected but blank Grafana and someone has to
      # rebuild the panels by hand. The directory is empty in the image, so adding a
      # provider to it costs nothing until a file is actually written.
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    # Grafana health-checks each datasource on start-up, so it must not begin before
    # the stores it points at are listening, or it logs a connection error per
    # datasource and shows them red until something restarts it. Waiting on the
    # health checks rather than on container start is what makes that true after a
    # restart, not just on a first run when everything happened to be slow.
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/config.yml"]
    # Loopback only: the log store holds request payloads and user identifiers.
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    # The collector pushes to this, so it has to be answering before the
    # collector starts. The image ships busybox wget and no curl, and wget exits
    # non-zero on an HTTP error, so this cannot pass merely because the port is
    # open while Loki is still initialising.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Checks that fail inside this window do not count towards retries, which is
      # what absorbs a slow first start without loosening the probe afterwards.
      start_period: 30s

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yml"]
    # 3200 is the query API (loopback only, like Loki); 4317 is ingestion and is reachable
    # only from the otel-collector, which forwards traces to tempo:4317.
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "4317"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    # Tempo answers /ready only once its ingester has joined its own memberlist
    # ring, and the startup log shows it logging "auto-joining cluster after
    # timeout" before settling, so it reports 503 for a stretch after the port is
    # already open. The longer start_period is what keeps that transient from
    # being read as a failure, and the retries are what stop a single later 503
    # from flipping an otherwise working container to unhealthy.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
    name: confessit_postgres_data
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

