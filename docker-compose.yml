services:

  frontend:
    build:
      context: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    ports:
      - "5173:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  backend:
    build:
      context: ./backend
    command: [
      "uvicorn",
      "app.main:app",
      "--host",
      "0.0.0.0",
      "--port",
      "8001",
      "--reload",
      "--reload-dir",
      "app",
      # Bound how many request bodies can be in flight at once, and how many bytes are
      # buffered for an unfinished request. Per-body size is capped in app.main.
      "--limit-concurrency",
      "${MAX_CONCURRENCY:-100}",
      "--h11-max-incomplete-event-size",
      "16384"
    ]
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./archives:/app/archives
    depends_on:
      - redis
      - postgres
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY: "0.5"
      # Read by both the --limit-concurrency flag above and the app's own settings, so
      # the ceiling cannot differ between how the server is started and how it is
      # configured. Raising it widens what one process will hold at once, so the request
      # body cap is what should move first if this needs raising.
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-100}
      # Injected so backend/.env can resolve REDIS_URL="redis://:${REDIS_PASSWORD}@redis:6379"
      # via python-dotenv, which keeps the root .env the only file the credential is written
      # in. REDIS_URL itself stays out of this file; setting it in the environment overrides.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env}
      DATABASE_URL: "postgresql+psycopg://confessit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}@postgres:5432/ConfessIt"

      TEST_DATABASE_URL: "postgresql+psycopg://confessit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}@postgres:5432/ConfessIt_Test"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "confessit-backend"
  postgres:
    image: postgres:16-alpine
    # Published to the host on loopback only, so a host-side psql/DBeaver can attach
    # while nothing on the network can reach the database or the application data in
    # it. This is the same posture as the observability UIs below, which bind
    # 127.0.0.1 too. The earlier "5432:5432" mapping bound every host interface and
    # was the LAN exposure.
    #
    # The host port is 5433, not 5432, because an installed PostgreSQL 18 Windows
    # service (postgresql-x64-18) already holds the host's 5432 on 0.0.0.0:5432, and
    # two listeners cannot share a port. 5433 is free. The container port is still 5432
    # and every other service reaches it as postgres:5432 over the Compose network.
    # If that service is ever removed, change the host side back to 5432 to match the
    # port clients already expect.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: confessit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ConfessIt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
  redis:
    image: redis:7-alpine
    container_name: confessit_redis
    restart: unless-stopped
    # Chat traffic rides on conversation:<id> pub/sub channels, so an open Redis lets
    # anyone on the network read every live message and publish forged ones. The port is
    # internal only (expose, not ports) and the server refuses commands without a password.
    # The password arrives as an env var and the shell below expands it, keeping the secret
    # out of the process arguments where `ps` inside the container would expose it. Compose
    # resolves ${REDIS_PASSWORD} from the shell environment or the gitignored root .env, so
    # the value is injected at start-up and no credential is stored in this tracked file.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the root .env}
    command: >
      sh -c 'exec redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --requirepass "$$REDIS_PASSWORD"'
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  otel-collector:
    # The Docker Hub org is otel/, not opentelemetry/; the latter is not a pullable
    # repository, so this service could not start at all.
    image: otel/opentelemetry-collector-contrib:0.99.0
    command: ["--config=/etc/otel-collector-config.yml"]
    # Ingestion and scrape ports are reachable only on the Compose network: the backend
    # pushes to otel-collector:4317 and Prometheus scrapes otel-collector:8889, neither of
    # which needs a host socket. Nothing here should be exposed beyond the host.
    expose:
      - "4317"
      - "4318"
      - "8889"
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Tempo 2.5's metrics-generator delivers the RED and service-graph series it
      # derives from traces by remote write; it has no local scrape endpoint. This
      # flag is the receiver for that. The endpoint stays bound to loopback.
      - "--web.enable-remote-write-receiver"
    # Loopback only: the metrics contain request rates, error counts and target topology.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.3
    # Loopback only: Grafana is the read surface for every log, metric and trace in the
    # stack, so it must not be reachable from the LAN.
    ports:
      - "127.0.0.1:3050:3050"
    environment:
      # The image listens on 3000, but the port mapping above targets 3050, so without
      # this the host port forwards to a port nothing is listening on.
      GF_SERVER_HTTP_PORT: "3050"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Required, from the gitignored root .env. Note Grafana applies this only when it
      # initialises an empty database, so an existing grafana_data volume keeps the old
      # password until it is reset.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the root .env}
      # Anonymous read access is off by default; pinned so a future image default cannot
      # quietly open the dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: ""
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioned from the repository at every start, so the datasources are
      # recreated rather than configured once by hand. Read-only: Grafana must not be
      # able to rewrite the definitions that make the stack reproducible.
      #
      # Only the datasources subdirectory is overlaid, not the whole provisioning
      # path. Grafana also reads plugins/, notifiers/, alerting/ and dashboards/ from
      # there, and replacing the directory root hides the copies in the image, so it
      # logs a read error for each of the four. Overlaying the one directory that is
      # actually provisioned leaves the rest intact.
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    # Grafana health-checks each datasource on start-up, so it must not begin before
    # the stores it points at are listening, or it logs a connection error per
    # datasource and shows them red until something restarts it.
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/config.yml"]
    # Loopback only: the log store holds request payloads and user identifiers.
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yml"]
    # 3200 is the query API (loopback only, like Loki); 4317 is ingestion and is reachable
    # only from the otel-collector, which forwards traces to tempo:4317.
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - "4317"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo

volumes:
  postgres_data:
    name: confessit_postgres_data
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

