<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" fill="none" role="img" aria-labelledby="title desc">
<title id="title">ConfessIt heart locket — open state reference</title>
<desc id="desc">A reference composition showing the velvet-lined lid on the left and the stationary base on the right. The base center is left clear for a live verification interface.</desc>
<defs>
    <linearGradient id="outerGold" x1="58" y1="44" x2="440" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0E5"/><stop offset=".14" stop-color="#DDA09A"/><stop offset=".3" stop-color="#8F4654"/><stop offset=".48" stop-color="#F9D6C2"/><stop offset=".66" stop-color="#B86B72"/><stop offset=".84" stop-color="#F4C7B5"/><stop offset="1" stop-color="#8F4855"/>
    </linearGradient>
    <linearGradient id="innerGold" x1="103" y1="91" x2="416" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1E5"/><stop offset=".25" stop-color="#B96C72"/><stop offset=".5" stop-color="#F4C8B7"/><stop offset=".75" stop-color="#994D5A"/><stop offset="1" stop-color="#FFE0CB"/>
    </linearGradient>
    <linearGradient id="velvet" x1="126" y1="105" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E3446"/><stop offset=".34" stop-color="#4B2534"/><stop offset=".68" stop-color="#351A28"/><stop offset="1" stop-color="#24131E"/>
    </linearGradient>
    <radialGradient id="velvetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(223 180) rotate(58) scale(260 225)">
      <stop stop-color="#C9788B" stop-opacity=".45"/><stop offset="1" stop-color="#C9788B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silk" x1="130" y1="135" x2="370" y2="389" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE2D7"/><stop offset=".28" stop-color="#F1B5B3"/><stop offset=".58" stop-color="#C47A86"/><stop offset="1" stop-color="#71364A"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="121" y1="115" x2="386" y2="389" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0E7" stop-opacity=".85"/><stop offset="1" stop-color="#C77C89" stop-opacity=".3"/>
    </linearGradient>
    <filter id="drop" x="15" y="19" width="482" height="484" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="panelShadow" x="111" y="140" width="290" height="210" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="heartClip"><path d="M256 430C224 402 65 299 65 185C65 91 176 37 256 131C336 37 447 91 447 185C447 299 288 402 256 430Z"/></clipPath>
  
 <linearGradient id="bg" x1="0" y1="0" x2="860" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#512831"/><stop offset="1" stop-color="#28151E"/></linearGradient>
 <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 238) rotate(90) scale(260 390)"><stop stop-color="#A95467" stop-opacity=".24"/><stop offset="1" stop-color="#A95467" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="12" y="12" width="836" height="476" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="860" height="500" rx="26" fill="url(#bg)"/>
<rect width="860" height="500" rx="26" fill="url(#glow)"/>
<ellipse cx="430" cy="414" rx="340" ry="38" fill="#0D080C" opacity=".55" filter="url(#shadow)"/>
<!-- Open lid interior, mirrored so the hinge edge faces the stationary half. -->
<g transform="translate(474 42) scale(-0.86 0.86)">
  <path d="M256 449C216 416 51 309 51 186C51 78 175 18 256 117C337 18 461 78 461 186C461 309 296 416 256 449Z" fill="#170D13" opacity=".35" filter="url(#drop)"/>
  <path d="M256 430C224 402 65 299 65 185C65 91 176 37 256 131C336 37 447 91 447 185C447 299 288 402 256 430Z" fill="url(#outerGold)" stroke="#FFE9DB" stroke-width="2.4"/>
  <path d="M256 416C226 389 81 294 81 188C81 103 180 55 256 145C332 55 431 103 431 188C431 294 286 389 256 416Z" fill="#8C4856" opacity=".92"/>
  <path d="M256 405C227 380 96 289 96 190C96 119 184 73 256 160C328 73 416 119 416 190C416 289 285 380 256 405Z" fill="url(#velvet)" stroke="url(#innerGold)" stroke-width="5"/>
  <g clip-path="url(#heartClip)">
