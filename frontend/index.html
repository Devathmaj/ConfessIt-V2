<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page fetches bearer URLs (signed images, auth calls): no navigation or
         subresource fetch from it may send the page as a referrer. A meta policy travels
         with the document in every deployment, including static hosts with no header
         control; the dev server and prod Nginx repeat it as a header. (No CSP meta here:
         the full policy needs fonts, images and socket hosts that differ per deployment
         and lives in nginx.prod.conf.example; a meta copy would silently combine with it.) -->
    <meta name="referrer" content="no-referrer" />
    <!-- Attribution (invisible, do not remove): floral artwork under FREE LICENSE
         (WITH ATTRIBUTION) — <a href="https://www.magnific.com">designed by Freepik - Magnific.com</a>.
         The same notice is embedded in each public/floral_svgs file and in the JS bundle. -->
    <title>ConfessIt - Valentine's Day Anonymous Confessions</title>
    <meta name="description" content="Share your heart anonymously this Valentine's Day. Express your feelings, find love, and connect with others in our one-day Valentine's event." />
    <meta name="author" content="ConfessIt Team" />
    <meta name="keywords" content="Valentine's Day, anonymous confessions, love notes, matchmaking, Valentine's event" />

    <meta property="og:title" content="ConfessIt - Valentine's Day Anonymous Confessions" />
    <meta property="og:description" content="Share your heart anonymously this Valentine's Day. Express your feelings, find love, and connect with others." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@confessit_app" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta name="theme-color" content="#FFE5F2" />

    <!-- Theme bootstrap (color guide Appendix C): apply the saved theme before first
         paint so neither the class-based dark variant nor the data-theme tokens flash.
         Same storage key next-themes uses ("vite-ui-theme"); product default is dark
         (see src/main.tsx defaultTheme), so an empty store resolves to dark. Sets BOTH
         the .dark class (Tailwind dark: variant) and data-theme (semantic tokens). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vite-ui-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#181014' : '#FFE5F2');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Typography (source of truth: ConfessIt_Typography_Report.md §06-§07):
         Fraunces (display + italic accent), Plus Jakarta Sans (UI/body),
         DM Mono (numeric/code). Moved out of CSS @import so the browser
         discovers fonts earlier. CSP already allows fonts.googleapis.com /
         fonts.gstatic.com (see nginx.prod.conf.example). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,0..100;1,9..144,400..600,0..100&family=Plus+Jakarta+Sans:wght@400..800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
